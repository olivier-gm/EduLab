# Cada push a main construye la imagen, la sube a GitHub Container Registry
# (gratis) y Azure la reinicia con la versión nueva.
#
# Configuración única (ver README → "Despliegue con contenedor"):
#   · Secret AZURE_WEBAPP_NAME           nombre de tu Web App
#   · Secret AZURE_WEBAPP_PUBLISH_PROFILE  contenido del "perfil de publicación" (XML)
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen
        # ghcr.io/<tu usuario de GitHub en minúsculas>/edulab
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/edulab" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
